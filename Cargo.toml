[package]
name = "microvmctl"
version = "0.1.0"
edition = "2024"
description = "Manage and observe microvm.nix cloud-hypervisor VMs"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
