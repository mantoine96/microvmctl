name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test and lint (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: experimental-features = nix-command flakes
      # Builds the package (running its tests), clippy with warnings denied,
      # and rustfmt for the runner's own system; also evaluates the test VM
      # configurations.
      - run: nix flake check --print-build-logs

  test-vms:
    name: Build test VMs
    # The test guests are only defined for x86_64-linux.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: experimental-features = nix-command flakes
      # The guests cannot boot here (no KVM for cloud-hypervisor), but
      # building their runners catches microvm.nix or nixpkgs updates that
      # would break `test-vms up`.
      - run: nix build --print-build-logs --no-link .#mvmctl-test-a .#mvmctl-test-b .#mvmctl-test-c
